<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Dream Chaser - Photo Editor Pro</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(to right, #1e3c72, #2a5298);
      margin: 0;
      padding: 0;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    header {
      text-align: center;
      padding: 20px;
    }
    header h1 {
      font-size: 2.5rem;
      background: linear-gradient(to right, red, orange, yellow, green, blue, indigo, violet);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    img.profile {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      margin-bottom: 10px;
    }
    .container {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 20px;
    }
    .tools, .filters, .draw-tools {
      background-color: #222;
      padding: 15px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.5);
    }
    button, input[type=range], input[type=color] {
      margin: 5px 0;
      padding: 10px;
      border: none;
      border-radius: 5px;
      background-color: #444;
      color: #fff;
      cursor: pointer;
    }
    canvas {
      border: 1px solid #ccc;
      background: #fff;
    }
    footer {
      margin-top: 20px;
      text-align: center;
      font-size: 0.9rem;
      color: #ccc;
    }
  </style>
</head>
<body>
  <header>
    <img src="masud.jpg" alt="Masud" class="profile">
    <h1>Masud Rana</h1>
  </header>  <input type="file" id="upload" accept="image/*">
  <canvas id="canvas" width="500" height="400"></canvas>  <div class="container">
    <div class="tools">
      <h3>Basic Tools</h3>
      <button onclick="rotate()">Rotate</button>
      <button onclick="resize()">Resize</button>
      <button onclick="crop()">Crop</button>
    </div><div class="tools">
  <h3>Advanced Tools</h3>
  <label>Brightness <input type="range" min="-100" max="100" value="0" onchange="adjust('brightness', this.value)"></label>
  <label>Saturation <input type="range" min="-100" max="100" value="0" onchange="adjust('saturation', this.value)"></label>
  <label>Blur <input type="range" min="0" max="10" value="0" onchange="adjust('blur', this.value)"></label>
</div>

<div class="draw-tools">
  <h3>Draw</h3>
  <input type="color" id="drawColor">
  <button onclick="enableDraw()">Enable Drawing</button>
  <button onclick="disableDraw()">Disable Drawing</button>
</div>

  </div><button onclick="saveImage()">Save Image</button>

  <footer>
    Developed By <span style="color:pink">✿ Masud</span><br>
    © 2025 The Dream Chaser Zone<br>
    Created by Termuxmasud404
  </footer>  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    let drawing = false;
    let img = new Image();

    document.getElementById('upload').addEventListener('change', (e) => {
      const reader = new FileReader();
      reader.onload = function(event) {
        img.onload = () => {
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        }
        img.src = event.target.result;
      }
      reader.readAsDataURL(e.target.files[0]);
    });

    function rotate() {
      const temp = document.createElement('canvas');
      const tempCtx = temp.getContext('2d');
      temp.width = canvas.height;
      temp.height = canvas.width;
      tempCtx.translate(temp.width / 2, temp.height / 2);
      tempCtx.rotate(Math.PI / 2);
      tempCtx.drawImage(canvas, -canvas.width / 2, -canvas.height / 2);
      canvas.width = temp.width;
      canvas.height = temp.height;
      ctx.drawImage(temp, 0, 0);
    }

    function resize() {
      const scale = prompt('Scale factor (e.g., 0.5, 2):');
      if (scale) {
        const temp = document.createElement('canvas');
        temp.width = canvas.width * scale;
        temp.height = canvas.height * scale;
        temp.getContext('2d').drawImage(canvas, 0, 0, temp.width, temp.height);
        canvas.width = temp.width;
        canvas.height = temp.height;
        ctx.drawImage(temp, 0, 0);
      }
    }

    function crop() {
      const x = parseInt(prompt('X:')) || 0;
      const y = parseInt(prompt('Y:')) || 0;
      const w = parseInt(prompt('Width:')) || canvas.width;
      const h = parseInt(prompt('Height:')) || canvas.height;
      const imageData = ctx.getImageData(x, y, w, h);
      canvas.width = w;
      canvas.height = h;
      ctx.putImageData(imageData, 0, 0);
    }

    function adjust(type, value) {
      const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const data = imageData.data;
      for (let i = 0; i < data.length; i += 4) {
        if (type === 'brightness') {
          data[i] += parseInt(value);
          data[i + 1] += parseInt(value);
          data[i + 2] += parseInt(value);
        } else if (type === 'saturation') {
          const avg = (data[i] + data[i + 1] + data[i + 2]) / 3;
          data[i] += (data[i] - avg) * (value / 100);
          data[i + 1] += (data[i + 1] - avg) * (value / 100);
          data[i + 2] += (data[i + 2] - avg) * (value / 100);
        }
        // blur handled separately using CSS or complex kernel
      }
      ctx.putImageData(imageData, 0, 0);
    }

    function enableDraw() {
      canvas.addEventListener('mousedown', () => drawing = true);
      canvas.addEventListener('mouseup', () => drawing = false);
      canvas.addEventListener('mousemove', draw);
    }

    function disableDraw() {
      canvas.removeEventListener('mousedown', () => drawing = true);
      canvas.removeEventListener('mouseup', () => drawing = false);
      canvas.removeEventListener('mousemove', draw);
    }

    function draw(e) {
      if (!drawing) return;
      const rect = canvas.getBoundingClientRect();
      ctx.fillStyle = document.getElementById('drawColor').value;
      ctx.beginPath();
      ctx.arc(e.clientX - rect.left, e.clientY - rect.top, 3, 0, 2 * Math.PI);
      ctx.fill();
    }

    function saveImage() {
      const link = document.createElement('a');
      link.download = 'edited-image.png';
      link.href = canvas.toDataURL();
      link.click();
    }
  </script></body>
</html>
