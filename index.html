<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Dream Chaser - Photo Editor Pro</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Roboto', sans-serif;
    }
    body {
      background: linear-gradient(to right, #1e3c72, #2a5298);
      color: white;
      padding: 20px;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .profile-pic {
      border-radius: 50%;
      width: 80px;
      height: 80px;
      border: 3px solid #fff;
    }
    h1 {
      font-size: 32px;
      font-weight: 700;
      background: linear-gradient(to right, red, orange, green, blue, violet);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .container {
      display: grid;
      grid-template-columns: 200px 1fr 200px;
      gap: 20px;
      margin-top: 20px;
    }
    .sidebar, .tools {
      background: rgba(0,0,0,0.3);
      padding: 15px;
      border-radius: 10px;
    }
    .editor {
      background: #1a1a1a;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 400px;
      border-radius: 10px;
    }
    .editor img {
      max-width: 100%;
      max-height: 100%;
    }
    .btn {
      display: inline-block;
      margin-top: 15px;
      background: #1e90ff;
      padding: 10px 20px;
      border-radius: 6px;
      color: white;
      text-align: center;
      text-decoration: none;
      font-weight: bold;
      transition: background 0.3s ease;
    }
    .btn:hover {
      background: #0d6efd;
    }
    footer {
      text-align: center;
      margin-top: 40px;
      font-size: 14px;
    }
    footer span {
      color: #ff69b4;
    }
  </style>
</head>
<body>
  <header>
    <img src="masud.jpg" alt="Masud" class="profile-pic" />
    <h1>Masud Rana</h1>
  </header>  <div class="container">
    <div class="sidebar">
      <h3>Basic Tools</h3>
      <ul>
        <li>Crop</li>
        <li>Resize</li>
        <li>Rotate</li>
      </ul>
      <h3>Advanced Tools</h3>
      <ul>
        <li>Brightness</li>
        <li>Contrast</li>
        <li>Saturation</li>
        <li>AI</li>
        <li>Blog</li>
        <li>Background Remover</li>
        <li>Photo Filters</li>
      </ul>
    </div><div class="editor">
  <img src="https://images.unsplash.com/photo-1506744038136-46273834b3fb" alt="Editor Preview" />
</div>

<div class="tools">
  <h3>Filters</h3>
  <button>Grayscale</button>
  <button>Invert</button>
  <button>Sepia</button>
  <button>Clarendon</button>
  <button>Gingham</button>

  <h3>Adjustments</h3>
  <label>Brightness</label><input type="range">
  <label>Saturation</label><input type="range">
  <label>Blur</label><input type="range">
  <label>Brush Width</label><input type="range">

  <h3>Draw</h3>
  <button>Color</button>
  <button>Watermark</button>
</div>

  </div>  <div style="text-align:center">
    <a href="#" class="btn">Save Image</a>
  </div>  <footer>
    <p>Developed By <span>Masud</span></p>
    <p>© 2025 The Dream Chaser Zone<br>Created by Termuxmasud404</p>
  </footer>
</body>
</html>
