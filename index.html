<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Dream Chaser - Photo Editor Pro</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Roboto', sans-serif; }
    body { background: linear-gradient(to right, #1f1c2c, #928dab); color: #fff; padding: 20px; }
    .container { display: grid; grid-template-columns: 1fr 2fr 1fr; gap: 20px; align-items: start; }
    .panel, .editor, .filters { background: #2c2f48; border-radius: 20px; padding: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
    h1 { font-size: 2.5rem; margin-bottom: 20px; text-align: center; }
    .rainbow-text { background: linear-gradient(90deg, red, orange, yellow, green, blue, indigo, violet); -webkit-background-clip: text; color: transparent; display: inline-block; }
    .profile-pic { width: 100px; height: 100px; border-radius: 50%; display: block; margin: 0 auto 20px; border: 3px solid #fff; }
    button, input[type="file"] { margin-top: 10px; padding: 10px; border: none; border-radius: 10px; background: #4a90e2; color: #fff; cursor: pointer; font-weight: bold; }
    button:hover { background: #357ABD; }
    input[type="range"] { width: 100%; }
    canvas { width: 100%; max-height: 400px; border-radius: 10px; background: #000; }
    .footer { margin-top: 40px; text-align: center; font-size: 0.9rem; color: #ccc; }
  </style>
</head>
<body>
  <h1><img src="masud.jpg" alt="Masud Rana" class="profile-pic" /> <span class="rainbow-text">Masud Rana</span></h1>  <div class="container">
    <div class="panel">
      <h2>Basic Tools</h2>
      <button onclick="cropImage()">Crop</button>
      <button onclick="resizeImage()">Resize</button>
      <button onclick="rotateImage()">Rotate</button><h2 style="margin-top: 20px;">Advanced Tools</h2>
  <button onclick="adjustBrightness()">Brightness</button>
  <button onclick="adjustContrast()">Contrast</button>
  <button onclick="adjustSaturation()">Saturation</button>
  <button>AI</button>
  <button>Blog</button>
  <button onclick="removeBackground()">Background Remover</button>
  <button>Photo Filters</button>
</div>

<div class="editor">
  <input type="file" accept="image/*" id="upload" onchange="loadImage(event)" />
  <canvas id="canvas"></canvas>
  <button onclick="saveImage()">Save Image</button>
</div>

<div class="filters">
  <h2>Filters</h2>
  <button onclick="applyFilter('grayscale')">Grayscale</button>
  <button onclick="applyFilter('invert')">Invert</button>
  <button onclick="applyFilter('sepia')">Sepia</button>
  <button onclick="applyFilter('clarendon')">Clarendon</button>
  <button onclick="applyFilter('gingham')">Gingham</button>

  <h2 style="margin-top: 20px;">Adjustments</h2>
  Brightness: <input type="range" id="brightness" min="0" max="200" value="100" oninput="adjustImage()">
  Saturation: <input type="range" id="saturation" min="0" max="200" value="100" oninput="adjustImage()">
  Blur: <input type="range" id="blur" min="0" max="10" value="0" oninput="adjustImage()">
  Brush Width: <input type="range" id="brushWidth" min="1" max="20" value="5">

  <h2 style="margin-top: 20px;">Draw</h2>
  <button>Color</button>
  <button>Watermark</button>
</div>

  </div>  <div class="footer">
    Developed By <span class="rainbow-text">Masud</span><br>
    © 2025 The Dream Chaser Zone<br>
    Created by Termuxmasud404
  </div>  <script>
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    let img = new Image();

    function loadImage(event) {
      const file = event.target.files[0];
      const reader = new FileReader();
      reader.onload = function(e) {
        img.onload = function () {
          canvas.width = img.width;
          canvas.height = img.height;
          ctx.drawImage(img, 0, 0);
        }
        img.src = e.target.result;
      }
      reader.readAsDataURL(file);
    }

    function saveImage() {
      const link = document.createElement("a");
      link.download = "edited-image.png";
      link.href = canvas.toDataURL();
      link.click();
    }

    function adjustImage() {
      ctx.filter = `brightness(${document.getElementById("brightness").value}%) saturate(${document.getElementById("saturation").value}%) blur(${document.getElementById("blur").value}px)`;
      ctx.drawImage(img, 0, 0);
    }

    function applyFilter(type) {
      ctx.filter = type;
      ctx.drawImage(img, 0, 0);
    }
  </script></body>
</html>
